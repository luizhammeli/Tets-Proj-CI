name: Build-Test
permissions:
  contents: read
  pull-requests: write
  issues: write
# Controls when the action will run. 
# Triggers the workflow on push events but only for the master branch.
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, review_requested, edited]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build-and-test"
  build-and-test:
    # The type of runner that the job will run on
    runs-on: macos-latest
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_26.2.app
      
    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Install dependencies
      run: bundle install

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint via Fastlane
      run: bundle exec fastlane ci_lint

    - name: Run tests with coverage
      run: xcodebuild -scheme Tets-Proj-CI -sdk iphonesimulator -configuration Debug  -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro' -enableCodeCoverage YES clean test

    - name: Debug DerivedData structure
      run: |
        echo "==== DerivedData ===="
        ls ~/Library/Developer/Xcode/DerivedData

        echo "==== ProfileData ===="
        find ~/Library/Developer/Xcode/DerivedData -name "*.profdata"

        echo "==== Apps ===="
        find ~/Library/Developer/Xcode/DerivedData -name "*.app"

    - name: Generate LCOV
      run: |
        DERIVED=$(ls -td ~/Library/Developer/Xcode/DerivedData/Tets-Proj-CI-* | head -1)
        echo "DerivedData: $DERIVED"

        PROF=$(find "$DERIVED" -name "*.profdata" | head -1)
        echo "PROFDATA: $PROF"

        APP=$(find "$DERIVED/Build/Products/Debug-iphonesimulator" -name "*.app" | head -1)
        echo "APP: $APP"

        APP_BINARY="$APP/$(basename "$APP" .app)"
        TEST_BINARY="$TEST/$(basename "$TEST" .xctest)"

        xcrun llvm-cov export \
          -format=lcov \
          -instr-profile "$PROF" \
          -object "$APP_BINARY" \
          -object "$TEST_BINARY" \
          > coverage.lcov

        echo "LCOV GENERATED"
        head -20 coverage.lcov

